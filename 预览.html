<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>代码收集与预览工作台</title>
  <style>
    /* 亮色模式变量 */
    :root {
      --bg-main: #f8fafc;
      --bg-card: #ffffff;
      --border-color: #e2e8f0;
      --border-focus: #94a3b8;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #0f172a;
      --primary-hover: #334155;
      --danger: #ef4444;
      --radius: 10px;
      --canvas-bg: #ffffff;
    }

    /* 纯黑夜间模式变量 */
    body.dark-mode {
      --bg-main: #000000;
      --bg-card: #0d0d0d;
      --border-color: #222222;
      --border-focus: #444444;
      --text-main: #ffffff;
      --text-muted: #888888;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --danger: #f87171;
      --canvas-bg: #000000;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      overflow: hidden;
      transition: background-color 0.2s, color 0.2s;
    }

    /* ---------------- 左侧边栏 ---------------- */
    .sidebar {
      width: 320px;
      background: var(--bg-card);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      height: 100vh;
      transition: background-color 0.2s, border-color 0.2s;
    }

    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--border-color);
      flex-shrink: 0;
    }

    .sidebar-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .search-box {
      width: 100%;
      padding: 9px 12px;
      font-size: 14px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      outline: none;
      background: var(--bg-main);
      color: var(--text-main);
      transition: all 0.2s;
    }

    .search-box:focus {
      border-color: var(--border-focus);
    }

    /* 支持多文件无限堆积上下滑动的列表 */
    .snippet-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }

    .snippet-list::-webkit-scrollbar {
      width: 6px;
    }
    .snippet-list::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 4px;
    }

    .snippet-item {
      padding: 12px;
      border-radius: var(--radius);
      margin-bottom: 8px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-main);
    }

    .snippet-item:hover {
      border-color: var(--border-focus);
    }

    .snippet-item.active {
      background: var(--bg-card);
      border-color: var(--primary);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    .snippet-info {
      overflow: hidden;
      flex: 1;
      padding-right: 8px;
    }

    .snippet-name {
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .snippet-date {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .delete-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 15px;
      cursor: pointer;
      padding: 6px 8px;
      border-radius: 4px;
    }

    .delete-btn:hover {
      color: var(--danger);
      background: rgba(239, 68, 68, 0.15);
    }

    /* ---------------- 右侧主工作区 ---------------- */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 16px;
      overflow: hidden;
      height: 100vh;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: background-color 0.2s, border-color 0.2s;
    }

    .editor-card {
      flex-shrink: 0;
      transition: all 0.3s ease;
    }

    .card-header {
      padding: 10px 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-main);
      gap: 10px;
      flex-wrap: wrap;
    }

    .name-input {
      font-size: 14px;
      font-weight: 600;
      border: 1px solid var(--border-color);
      padding: 7px 12px;
      border-radius: 6px;
      outline: none;
      flex: 1;
      min-width: 180px;
      max-width: 260px;
      background: var(--bg-card);
      color: var(--text-main);
    }

    .btn-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 7px 12px;
      font-size: 13px;
      font-weight: 500;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-main);
      white-space: nowrap;
      transition: all 0.2s;
    }

    .btn:hover {
      border-color: var(--border-focus);
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-green {
      background: #16a34a !important;
      color: #ffffff !important;
      border-color: #16a34a !important;
    }

    .btn-blue {
      background: #2563eb !important;
      color: #ffffff !important;
      border-color: #2563eb !important;
    }

    .editor-body {
      height: 200px;
      transition: height 0.3s ease;
    }

    .editor-card.collapsed .editor-body {
      height: 0 !important;
      overflow: hidden;
    }

    textarea.code-editor {
      width: 100%;
      height: 100%;
      padding: 12px;
      border: none;
      outline: none;
      font-family: "Fira Code", Consolas, Monaco, monospace;
      font-size: 13px;
      line-height: 1.5;
      resize: none;
      color: var(--text-main);
      background: var(--bg-card);
    }

    /* 实时预览区 (自适应容器) */
    .preview-card {
      flex: 1;
      min-height: 250px;
    }

    .preview-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .preview-wrapper {
      flex: 1;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--canvas-bg);
      transition: background-color 0.2s;
    }

    iframe.preview-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .empty-tip {
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
      padding: 20px 0;
    }

    /* 手机端响应适配 */
    @media (max-width: 768px) {
      body {
        flex-direction: column;
        height: auto;
        min-height: 100vh;
        overflow-y: auto;
      }

      .sidebar {
        width: 100%;
        height: auto;
        max-height: 240px;
        border-right: none;
        border-bottom: 1px solid var(--border-color);
      }

      .main-content {
        height: auto;
        padding: 10px;
        gap: 12px;
        overflow: visible;
      }

      .card-header {
        flex-direction: column;
        align-items: stretch;
      }

      .name-input {
        max-width: 100%;
        width: 100%;
      }

      .btn-group {
        width: 100%;
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 6px;
      }

      .editor-body {
        height: 160px;
      }

      .preview-card {
        height: 500px;
      }
    }
  </style>
</head>
<body>

  <!-- 左侧：代码库（多文件上下滑动） -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">
        <span>我的代码库</span>
        <div style="display:flex; gap:6px;">
          <button type="button" class="btn" id="themeBtn" onclick="toggleDarkMode()">🌙 纯黑夜间</button>
          <button type="button" class="btn" onclick="clearEditor()">+ 清空新建</button>
        </div>
      </div>
      <input type="text" id="searchInput" class="search-box" placeholder="搜索已保存的代码..." oninput="renderSnippetList()">
    </div>
    <div class="snippet-list" id="snippetList"></div>
  </aside>

  <!-- 右侧：工作区 -->
  <main class="main-content">
    
    <!-- 代码编辑区 -->
    <div class="card editor-card" id="editorCard">
      <div class="card-header">
        <input type="text" id="snippetTitle" class="name-input" placeholder="输入代码名称...">
        <div class="btn-group">
          <button type="button" class="btn" id="collapseBtn" onclick="toggleEditor()">折叠框</button>
          <button type="button" class="btn" onclick="exportDocx()">📄 导出 docx</button>
          <button type="button" class="btn btn-green" onclick="saveAsNewSnippet()">+ 另存为新代码</button>
          <button type="button" class="btn btn-blue" onclick="updateCurrentSnippet()">💾 保存/更新当前</button>
          <button type="button" class="btn btn-blue" style="background:#0f172a !important;" onclick="updatePreview()">▶ 运行预览</button>
        </div>
      </div>
      <div class="editor-body" id="editorBody">
        <textarea id="codeEditor" class="code-editor" placeholder="在此粘贴你的代码（自带 ```html 也能自动识别过滤）..."></textarea>
      </div>
    </div>

    <!-- 实时预览区 -->
    <div class="card preview-card" id="previewCard">
      <div class="card-header">
        <span class="preview-title">实时预览效果 (100% 自适应)</span>
      </div>
      <div class="preview-wrapper">
        <iframe id="previewFrame" class="preview-frame" sandbox="allow-scripts allow-same-origin allow-modals allow-forms"></iframe>
      </div>
    </div>

  </main>

  <script>
    const STORAGE_KEY = 'my_code_workspace_v2';
    let snippets = [];
    let currentId = null;
    let isCollapsed = false;
    let isDarkMode = false;

    // 代码自动清洗：去除开头结尾可能自带的 ```html 和 ``` 标记
    function sanitizeCode(str) {
      if (!str) return '';
      let cleaned = str.trim();
      cleaned = cleaned.replace(/^```[a-zA-Z]*\r?\n?/, '');
      cleaned = cleaned.replace(/\r?\n?```$/, '');
      return cleaned.trim();
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadSnippets();
      if (snippets.length === 0) {
        loadDefaultExample();
      } else {
        renderSnippetList();
        selectSnippet(snippets[0].id);
      }
    });

    // 1. 切换【纯黑夜间模式】(#000000)
    function toggleDarkMode() {
      isDarkMode = !isDarkMode;
      if (isDarkMode) {
        document.body.classList.add('dark-mode');
        document.getElementById('themeBtn').textContent = '☀️ 亮色模式';
      } else {
        document.body.classList.remove('dark-mode');
        document.getElementById('themeBtn').textContent = '🌙 纯黑夜间';
      }
      updatePreview();
    }

    // 2. 本地存储安全读取
    function loadSnippets() {
      try {
        const data = localStorage.getItem(STORAGE_KEY);
        snippets = data ? JSON.parse(data) : [];
      } catch (e) {
        snippets = [];
      }
    }

    function saveToStorage() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(snippets));
      } catch (e) {
        console.warn('存储空间不可用');
      }
    }

    // 3. 渲染代码列表（支持多文件向上/下滑动）
    function renderSnippetList() {
      const keyword = (document.getElementById('searchInput').value || '').toLowerCase().trim();
      const listContainer = document.getElementById('snippetList');
      listContainer.innerHTML = '';

      const filtered = snippets.filter(item => (item.title || '').toLowerCase().includes(keyword));

      if (filtered.length === 0) {
        listContainer.innerHTML = '<div class="empty-tip">暂无匹配的代码</div>';
        return;
      }

      filtered.forEach(item => {
        const div = document.createElement('div');
        div.className = `snippet-item ${item.id === currentId ? 'active' : ''}`;
        div.onclick = () => selectSnippet(item.id);

        div.innerHTML = `
          <div class="snippet-info">
            <div class="snippet-name">${escapeHtml(item.title || '未命名代码')}</div>
            <div class="snippet-date">${item.date}</div>
          </div>
          <button type="button" class="delete-btn" onclick="deleteSnippet(event, '${item.id}')" title="删除">✕</button>
        `;
        listContainer.appendChild(div);
      });
    }

    // 4. 点击列表项：载入代码并【立刻渲染预览】
    function selectSnippet(id) {
      const item = snippets.find(s => s.id === id);
      if (!item) return;

      currentId = item.id;
      document.getElementById('snippetTitle').value = item.title || '';
      document.getElementById('codeEditor').value = item.code || '';
      
      renderSnippetList();
      updatePreview();

      if (window.innerWidth <= 768) {
        document.getElementById('previewCard').scrollIntoView({ behavior: 'smooth' });
      }
    }

    // 5A. 另存为【新代码】（新增记录，不会覆盖原有代码！）
    function saveAsNewSnippet() {
      const title = document.getElementById('snippetTitle').value.trim() || '未命名代码';
      const rawCode = document.getElementById('codeEditor').value;
      const code = sanitizeCode(rawCode);

      if (!code) {
        alert('请输入代码后再保存！');
        return;
      }

      const date = new Date().toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
      const newSnippet = { id: Date.now().toString(), title, code, date };
      
      snippets.unshift(newSnippet);
      currentId = newSnippet.id;

      saveToStorage();
      renderSnippetList();
      updatePreview();
      alert('已成功保存为新代码！列表已更新。');
    }

    // 5B. 保存/更新【当前选中的代码】
    function updateCurrentSnippet() {
      if (!currentId) {
        saveAsNewSnippet();
        return;
      }

      const title = document.getElementById('snippetTitle').value.trim() || '未命名代码';
      const rawCode = document.getElementById('codeEditor').value;
      const code = sanitizeCode(rawCode);

      const date = new Date().toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
      const index = snippets.findIndex(s => s.id === currentId);

      if (index !== -1) {
        snippets[index] = { ...snippets[index], title, code, date };
        saveToStorage();
        renderSnippetList();
        updatePreview();
        alert('当前代码修改成功！');
      } else {
        saveAsNewSnippet();
      }
    }

    // 6. 导出 DOCX 文档
    function exportDocx() {
      const title = document.getElementById('snippetTitle').value.trim() || '代码片段';
      const rawCode = document.getElementById('codeEditor').value;
      const code = sanitizeCode(rawCode);

      if (!code) {
        alert('代码框为空，无法导出！');
        return;
      }

      const docHtml = `
        <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
        <head>
          <meta charset="utf-8">
          <title>${escapeHtml(title)}</title>
          <style>
            body { font-family: Arial, sans-serif; padding: 20px; line-height: 1.5; }
            h1 { font-size: 18pt; color: #000000; border-bottom: 2px solid #000; padding-bottom: 6px; }
            pre { background: #f1f5f9; padding: 12px; border-radius: 6px; font-family: Consolas, monospace; font-size: 10pt; white-space: pre-wrap; word-wrap: break-word; }
          </style>
        </head>
        <body>
          <h1>${escapeHtml(title)}</h1>
          <p style="color:#666; font-size:9pt;">导出时间：${new Date().toLocaleString('zh-CN')}</p>
          <hr/>
          <pre>${escapeHtml(code)}</pre>
        </body>
        </html>
      `;

      const blob = new Blob(['\ufeff', docHtml], { type: 'application/msword;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${title}.docx`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // 7. 清空编辑器准备新建
    function clearEditor() {
      currentId = null;
      document.getElementById('snippetTitle').value = '';
      document.getElementById('codeEditor').value = '';
      document.getElementById('previewFrame').srcdoc = '';
      renderSnippetList();
    }

    // 8. 删除代码
    function deleteSnippet(event, id) {
      if (event) event.stopPropagation();
      if (confirm('确定要删除这份代码吗？')) {
        snippets = snippets.filter(s => s.id !== id);
        saveToStorage();
        if (currentId === id) {
          clearEditor();
        } else {
          renderSnippetList();
        }
      }
    }

    // 9. 更新实时预览（自适应尺寸 + 原生 JS 动态监听正常触发）
    function updatePreview() {
      const rawCode = document.getElementById('codeEditor').value || '';
      const code = sanitizeCode(rawCode);
      const iframe = document.getElementById('previewFrame');
      
      const bgStyle = isDarkMode ? '#000000' : '#ffffff';
      const textStyle = isDarkMode ? '#ffffff' : '#0f172a';

      // 保证组件自适应 100% 容器宽高，且背景主题强关联
      const baseAdaptiveStyle = `<style>
        *, *::before, *::after { box-sizing: border-box; }
        html, body {
          margin: 0;
          padding: 0;
          width: 100%;
          min-height: 100vh;
          background-color: ${bgStyle} !important;
          color: ${textStyle};
          overflow-x: hidden;
        }
      </style>`;

      iframe.srcdoc = baseAdaptiveStyle + code;
    }

    // 10. 折叠/展开编辑框
    function toggleEditor() {
      const card = document.getElementById('editorCard');
      const btn = document.getElementById('collapseBtn');
      isCollapsed = !isCollapsed;

      if (isCollapsed) {
        card.classList.add('collapsed');
        btn.textContent = '展开框';
      } else {
        card.classList.remove('collapsed');
        btn.textContent = '折叠框';
      }
    }

    function escapeHtml(str) {
      return (str || '').replace(/[&<>"']/g, match => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[match]));
    }

    function loadDefaultExample() {
      const exampleSnippet = {
        id: 'default-1',
        title: '示例卡片组件',
        code: `<div style="padding: 30px; text-align: center;">\n  <h2>代码工作台准备就绪</h2>\n  <p style="margin-top:10px; color:#888;">在此粘贴代码，点击【+ 另存为新代码】即可无限堆积保存！</p>\n</div>`,
        date: new Date().toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' })
      };
      snippets = [exampleSnippet];
      saveToStorage();
      renderSnippetList();
      selectSnippet(exampleSnippet.id);
    }
  </script>
</body>
</html>

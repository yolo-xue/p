<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>代码收集与预览工作台</title>
  <style>
    :root {
      --bg-main: #ffffff;
      --bg-card: #ffffff;
      --border-color: #cccccc;
      --border-focus: #000000;
      --text-main: #000000;
      --text-muted: #666666;
      --btn-bg: #ffffff;
      --btn-text: #000000;
      --btn-border: #000000;
      --btn-hover: #f0f0f0;
      --canvas-bg: #f9f9f9; /* 给画布一点点底色，更容易区分 */
    }

    body.dark-mode {
      --bg-main: #000000;
      --bg-card: #000000;
      --border-color: #333333;
      --border-focus: #ffffff;
      --text-main: #ffffff;
      --text-muted: #888888;
      --btn-bg: #000000;
      --btn-text: #ffffff;
      --btn-border: #ffffff;
      --btn-hover: #1a1a1a;
      --canvas-bg: #0a0a0a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    .sidebar {
      width: 240px;
      background: var(--bg-card);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      height: 100vh;
    }

    .sidebar-header {
      padding: 8px;
      border-bottom: 1px solid var(--border-color);
      flex-shrink: 0;
    }

    .sidebar-title {
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .search-box {
      width: 100%;
      padding: 4px 6px;
      font-size: 12px;
      border: 1px solid var(--border-color);
      outline: none;
      background: var(--bg-card);
      color: var(--text-main);
    }

    .search-box:focus {
      border-color: var(--border-focus);
    }

    .snippet-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px;
    }

    .snippet-item {
      padding: 6px;
      margin-bottom: 4px;
      border: 1px solid var(--border-color);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-card);
      font-size: 12px;
    }

    .snippet-item:hover {
      border-color: var(--border-focus);
    }

    .snippet-item.active {
      border-color: var(--border-focus);
      background: var(--btn-hover);
      font-weight: bold;
    }

    .snippet-info {
      overflow: hidden;
      flex: 1;
    }

    .snippet-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .snippet-date {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .delete-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 11px;
      cursor: pointer;
      padding: 2px 4px;
      margin-left: 4px;
    }

    .delete-btn:hover {
      color: var(--text-main);
      text-decoration: underline;
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 8px;
      gap: 8px;
      overflow: hidden;
      height: 100vh;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .editor-card {
      flex-shrink: 0;
    }

    .card-header {
      padding: 6px 8px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .name-input {
      font-size: 12px;
      border: 1px solid var(--border-color);
      padding: 4px 6px;
      outline: none;
      flex: 1;
      min-width: 120px;
      max-width: 200px;
      background: var(--bg-card);
      color: var(--text-main);
    }

    .name-input:focus {
      border-color: var(--border-focus);
    }

    .btn-group {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      align-items: center;
    }

    .btn {
      padding: 4px 8px;
      font-size: 12px;
      cursor: pointer;
      border: 1px solid var(--btn-border);
      background: var(--btn-bg);
      color: var(--btn-text);
      white-space: nowrap;
    }

    .btn:hover {
      background: var(--btn-hover);
    }

    .btn.active {
      background: var(--btn-text);
      color: var(--btn-bg);
    }

    .editor-body {
      height: 160px;
    }

    .editor-card.collapsed .editor-body {
      height: 0 !important;
      overflow: hidden;
    }

    textarea.code-editor {
      width: 100%;
      height: 100%;
      padding: 8px;
      border: none;
      outline: none;
      font-family: Consolas, Monaco, monospace;
      font-size: 12px;
      line-height: 1.4;
      resize: none;
      color: var(--text-main);
      background: var(--bg-card);
    }

    .preview-card {
      flex: 1;
      min-height: 200px;
    }

    .preview-title-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .preview-title {
      font-size: 12px;
      font-weight: bold;
    }

    .scale-control {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: var(--text-muted);
    }

    .preview-wrapper {
      flex: 1;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--canvas-bg);
      position: relative;
    }

    iframe.preview-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .empty-tip {
      text-align: center;
      color: var(--text-muted);
      font-size: 12px;
      padding: 12px 0;
    }

    @media (max-width: 768px) {
      body {
        flex-direction: column;
        height: auto;
        min-height: 100vh;
        overflow-y: auto;
      }

      .sidebar {
        width: 100%;
        height: auto;
        max-height: 160px;
        border-right: none;
        border-bottom: 1px solid var(--border-color);
      }

      .main-content {
        height: auto;
        padding: 6px;
        gap: 6px;
        overflow: visible;
      }

      .card-header {
        flex-direction: column;
        align-items: stretch;
      }

      .name-input {
        max-width: 100%;
        width: 100%;
      }

      .btn-group {
        width: 100%;
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 4px;
      }

      .editor-body {
        height: 140px;
      }

      .preview-card {
        height: 480px;
      }
    }
  </style>
</head>
<body>

  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">
        <span>代码列表</span>
        <div style="display:flex; gap:4px;">
          <button type="button" class="btn" id="themeBtn" onclick="toggleDarkMode()">夜间模式</button>
          <button type="button" class="btn" onclick="clearEditor()">新建</button>
        </div>
      </div>
      <input type="text" id="searchInput" class="search-box" placeholder="搜索文件..." oninput="renderSnippetList()">
    </div>
    <div class="snippet-list" id="snippetList"></div>
  </aside>

  <main class="main-content">
    
    <div class="card editor-card" id="editorCard">
      <div class="card-header">
        <input type="text" id="snippetTitle" class="name-input" placeholder="代码标题...">
        <div class="btn-group">
          <button type="button" class="btn" id="collapseBtn" onclick="toggleEditor()">折叠代码框</button>
          <button type="button" class="btn" onclick="exportDocx()">导出 docx</button>
          <button type="button" class="btn" onclick="saveSnippet()">保存代码</button>
          <button type="button" class="btn" onclick="updatePreview()">运行预览</button>
        </div>
      </div>
      <div class="editor-body" id="editorBody">
        <textarea id="codeEditor" class="code-editor" placeholder="在此粘贴代码..."></textarea>
      </div>
    </div>

    <div class="card preview-card" id="previewCard">
      <div class="card-header">
        <div class="preview-title-group">
          <span class="preview-title">实时预览</span>
          <div class="scale-control">
            <span>视角:</span>
            <button type="button" class="btn active" id="scale100" onclick="setScale(1.0)">100% 原始尺寸</button>
            <button type="button" class="btn" id="scale80" onclick="setScale(0.8)">80%</button>
            <button type="button" class="btn" id="scale60" onclick="setScale(0.6)">60%</button>
          </div>
        </div>
      </div>
      <div class="preview-wrapper">
        <iframe id="previewFrame" class="preview-frame" sandbox="allow-scripts allow-same-origin"></iframe>
      </div>
    </div>

  </main>

  <script>
    const STORAGE_KEY = 'workspace_saved_snippets';
    let snippets = [];
    let currentId = null;
    let isCollapsed = false;
    let isDarkMode = false;
    let currentScale = 1.0;

    window.addEventListener('DOMContentLoaded', () => {
      loadSnippets();
      renderSnippetList();
      if (snippets.length > 0) {
        selectSnippet(snippets[0].id);
      } else {
        clearEditor();
      }
    });

    function toggleDarkMode() {
      isDarkMode = !isDarkMode;
      if (isDarkMode) {
        document.body.classList.add('dark-mode');
        document.getElementById('themeBtn').textContent = '日间模式';
      } else {
        document.body.classList.remove('dark-mode');
        document.getElementById('themeBtn').textContent = '夜间模式';
      }
      updatePreview();
    }

    function setScale(scaleValue) {
      currentScale = scaleValue;
      document.getElementById('scale100').classList.toggle('active', scaleValue === 1.0);
      document.getElementById('scale80').classList.toggle('active', scaleValue === 0.8);
      document.getElementById('scale60').classList.toggle('active', scaleValue === 0.6);
      updatePreview();
    }

    function loadSnippets() {
      try {
        const data = localStorage.getItem(STORAGE_KEY);
        snippets = data ? JSON.parse(data) : [];
      } catch (e) {
        snippets = [];
      }
    }

    function saveToStorage() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(snippets));
      } catch (e) {
        console.warn('存储受限');
      }
    }

    function renderSnippetList() {
      const keyword = (document.getElementById('searchInput').value || '').toLowerCase().trim();
      const listContainer = document.getElementById('snippetList');
      listContainer.innerHTML = '';

      const filtered = snippets.filter(item => (item.title || '').toLowerCase().includes(keyword));

      if (filtered.length === 0) {
        listContainer.innerHTML = '<div class="empty-tip">暂无文件</div>';
        return;
      }

      filtered.forEach(item => {
        const div = document.createElement('div');
        div.className = `snippet-item ${String(item.id) === String(currentId) ? 'active' : ''}`;
        div.onclick = () => selectSnippet(item.id);

        div.innerHTML = `
          <div class="snippet-info">
            <div class="snippet-name">${escapeHtml(item.title || '未命名文件')}</div>
            <div class="snippet-date">${item.date}</div>
          </div>
          <button type="button" class="delete-btn" onclick="deleteSnippet(event, '${item.id}')">删除</button>
        `;
        listContainer.appendChild(div);
      });
    }

    function selectSnippet(id) {
      const item = snippets.find(s => String(s.id) === String(id));
      if (!item) return;

      currentId = item.id;
      document.getElementById('snippetTitle').value = item.title || '';
      document.getElementById('codeEditor').value = item.code || '';
      
      renderSnippetList();
      updatePreview();

      if (window.innerWidth <= 768) {
        document.getElementById('previewCard').scrollIntoView({ behavior: 'smooth' });
      }
    }

    function saveSnippet() {
      const titleInput = document.getElementById('snippetTitle').value.trim();
      const codeInput = document.getElementById('codeEditor').value;

      if (!titleInput && !codeInput) {
        alert('请输入标题或代码后再保存');
        return;
      }

      const title = titleInput || '未命名代码';
      const code = codeInput;
      const date = new Date().toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });

      if (currentId !== null && currentId !== undefined && currentId !== '') {
        const index = snippets.findIndex(s => String(s.id) === String(currentId));
        if (index !== -1) {
          snippets[index] = { ...snippets[index], title, code, date };
        } else {
          const newSnippet = { id: Date.now().toString(), title, code, date };
          snippets.unshift(newSnippet);
          currentId = newSnippet.id;
        }
      } else {
        const newSnippet = { id: Date.now().toString(), title, code, date };
        snippets.unshift(newSnippet);
        currentId = newSnippet.id;
      }

      saveToStorage();
      renderSnippetList();
      updatePreview();
    }

    function exportDocx() {
      const title = document.getElementById('snippetTitle').value.trim() || '代码文件';
      const code = document.getElementById('codeEditor').value;

      if (!code) {
        alert('无代码内容');
        return;
      }

      const docHtml = `
        <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
        <head>
          <meta charset="utf-8">
          <title>${escapeHtml(title)}</title>
          <style>
            body { font-family: Arial, sans-serif; padding: 20px; }
            pre { background: #f4f4f4; padding: 10px; font-family: Consolas, monospace; font-size: 10pt; white-space: pre-wrap; word-wrap: break-word; }
          </style>
        </head>
        <body>
          <h2>${escapeHtml(title)}</h2>
          <p style="color:#666; font-size:9pt;">时间：${new Date().toLocaleString('zh-CN')}</p>
          <hr/>
          <pre>${escapeHtml(code)}</pre>
        </body>
        </html>
      `;

      const blob = new Blob(['\ufeff', docHtml], { type: 'application/msword;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${title}.docx`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function clearEditor() {
      currentId = null;
      document.getElementById('snippetTitle').value = '';
      document.getElementById('codeEditor').value = '';
      document.getElementById('previewFrame').srcdoc = '';
      renderSnippetList();
    }

    function deleteSnippet(event, id) {
      if (event) event.stopPropagation();
      if (confirm('确认删除？')) {
        snippets = snippets.filter(s => String(s.id) !== String(id));
        saveToStorage();
        if (String(currentId) === String(id)) {
          clearEditor();
        } else {
          renderSnippetList();
        }
      }
    }

    function cleanCodeForPreview(code) {
      if (!code) return '';
      let cleaned = code.trim();
      cleaned = cleaned.replace(/^```[a-zA-Z0-9_-]*\s*/gmi, '');
      cleaned = cleaned.replace(/\s*```$/gmi, '');
      cleaned = cleaned.replace(/```html/gim, '');
      cleaned = cleaned.replace(/```/g, '');
      return cleaned.trim();
    }

    // ==========================================
    // 核心修复区域：修正了导致截断和居中异常的渲染逻辑
    // ==========================================
    function updatePreview() {
      const rawCode = document.getElementById('codeEditor').value || '';
      const iframe = document.getElementById('previewFrame');
      const cleanCode = cleanCodeForPreview(rawCode);

      // 同步工作台背景色，我稍微去掉了 !important 以防覆盖用户自己的背景代码
      const bg = isDarkMode ? '#0a0a0a' : '#f9f9f9';
      const text = isDarkMode ? '#ffffff' : '#000000';

      const baseStyle = `<style>
        /* 重置默认样式，保证基础盒模型正常 */
        html {
          box-sizing: border-box;
          color-scheme: ${isDarkMode ? 'dark' : 'light'};
        }
        *, *::before, *::after {
          box-sizing: inherit;
        }

        body {
          margin: 0;
          padding: 24px;
          min-height: 100vh;
          background-color: ${bg};
          color: ${text};
          
          /* 💡 修复重点 1：使用安全居中 (safe center) */
          /* 如果组件比画布小：它完美在正中间显示 */
          /* 如果组件比画布大：它会自动退化为顶部/左侧对齐，生成正确的滚动条，绝不会吞掉内容！ */
          display: grid;
          place-content: safe center;
          place-items: safe center;
          
          /* 💡 修复重点 2：使用 zoom 替代 transform: scale */
          /* zoom 能完美实现缩放同时告诉浏览器正确的滚动边界 */
          zoom: ${currentScale};
        }

        /* 如果遇到极少数不支持 zoom 的浏览器，提供安全降级 */
        @supports not (zoom: 1) {
          body {
            transform: scale(${currentScale});
            transform-origin: top left;
            width: ${100 / currentScale}%;
            min-height: ${100 / currentScale}vh;
          }
        }
      </style>`;

      iframe.srcdoc = baseStyle + cleanCode;
    }

    function toggleEditor() {
      const card = document.getElementById('editorCard');
      const btn = document.getElementById('collapseBtn');
      isCollapsed = !isCollapsed;

      if (isCollapsed) {
        card.classList.add('collapsed');
        btn.textContent = '展开代码框';
      } else {
        card.classList.remove('collapsed');
        btn.textContent = '折叠代码框';
      }
    }

    function escapeHtml(str) {
      return (str || '').replace(/[&<>"']/g, match => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[match]));
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>代码收集与预览工作台</title>
  <style>
    :root {
      --bg-main: #f8fafc;
      --bg-card: #ffffff;
      --border-color: #e2e8f0;
      --border-focus: #94a3b8;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #0f172a;
      --primary-hover: #334155;
      --danger: #ef4444;
      --radius: 10px;
    }

    body.dark-mode {
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --border-color: #334155;
      --border-focus: #64748b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --danger: #f87171;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      overflow: hidden;
      transition: background-color 0.2s, color 0.2s;
    }

    /* ---------------- 左侧边栏 ---------------- */
    .sidebar {
      width: 310px;
      background: var(--bg-card);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      z-index: 10;
    }

    .sidebar-header {
      padding: 14px;
      border-bottom: 1px solid var(--border-color);
    }

    .sidebar-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .search-box {
      width: 100%;
      padding: 9px 12px;
      font-size: 13px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      outline: none;
      background: var(--bg-main);
      color: var(--text-main);
    }

    /* 代码堆积列表：支持无限多文件上下滑动 */
    .snippet-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      -webkit-overflow-scrolling: touch;
    }

    .snippet-item {
      padding: 12px;
      border-radius: var(--radius);
      margin-bottom: 8px;
      border: 1px solid var(--border-color);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-main);
      user-select: none;
    }

    .snippet-item:active {
      opacity: 0.8;
    }

    .snippet-item.active {
      background: var(--bg-card);
      border-color: var(--primary);
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    .snippet-info {
      overflow: hidden;
      flex: 1;
      padding-right: 8px;
    }

    .snippet-name {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .snippet-date {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .delete-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 15px;
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 4px;
      z-index: 15;
    }

    .delete-btn:hover {
      color: var(--danger);
      background: rgba(239, 68, 68, 0.12);
    }

    /* ---------------- 右侧主区域 ---------------- */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 14px;
      gap: 12px;
      overflow: hidden;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .card-header {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-main);
      gap: 8px;
      flex-wrap: wrap;
      z-index: 5;
    }

    .name-input {
      font-size: 14px;
      font-weight: 600;
      border: 1px solid var(--border-color);
      padding: 7px 10px;
      border-radius: 6px;
      outline: none;
      flex: 1;
      min-width: 150px;
      background: var(--bg-card);
      color: var(--text-main);
    }

    .btn-group {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-main);
      white-space: nowrap;
      touch-action: manipulation;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    body.dark-mode .btn-primary {
      color: #0f172a;
    }

    .editor-body {
      height: 190px;
      transition: height 0.25s ease;
    }

    .editor-card.collapsed .editor-body {
      height: 0 !important;
      overflow: hidden;
    }

    textarea.code-editor {
      width: 100%;
      height: 100%;
      padding: 12px;
      border: none;
      outline: none;
      font-family: Consolas, Monaco, monospace;
      font-size: 13px;
      line-height: 1.45;
      resize: none;
      color: var(--text-main);
      background: var(--bg-card);
    }

    /* 预览画板 */
    .preview-card {
      flex: 1;
      min-height: 220px;
    }

    .preview-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .preview-wrapper {
      flex: 1;
      width: 100%;
      height: 100%;
      overflow: auto;
      background: #ffffff; /* 预览画布默认保持纯白 */
      position: relative;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      -webkit-overflow-scrolling: touch;
    }

    iframe.preview-frame {
      width: 100%;
      height: 100%;
      border: none;
      background: #ffffff;
      transform-origin: top center;
      transition: transform 0.2s;
    }

    .empty-tip {
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
      padding: 20px 0;
    }

    /* ---------------- 移动端全屏幕适配 ---------------- */
    @media (max-width: 768px) {
      body {
        flex-direction: column;
        height: auto;
        min-height: 100vh;
        overflow-y: auto;
      }

      .sidebar {
        width: 100%;
        max-height: 220px;
        border-right: none;
        border-bottom: 1px solid var(--border-color);
      }

      .snippet-list {
        max-height: 130px;
      }

      .main-content {
        padding: 8px;
        gap: 10px;
        overflow: visible;
      }

      .card-header {
        flex-direction: column;
        align-items: stretch;
      }

      .name-input {
        width: 100%;
      }

      .btn-group {
        width: 100%;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
      }

      .btn {
        padding: 8px 2px;
        font-size: 11px;
        text-align: center;
      }

      .editor-body {
        height: 150px;
      }

      .preview-card {
        height: 480px;
        min-height: 400px;
      }
    }
  </style>
</head>
<body>

  <!-- 左侧：代码库 & 搜索 -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">
        <span>我的代码库</span>
        <div style="display:flex; gap:6px;">
          <button class="btn" id="themeBtn" onclick="toggleDarkMode()">🌙 夜间模式</button>
          <button class="btn" onclick="clearEditor()">+ 新建</button>
        </div>
      </div>
      <input type="text" id="searchInput" class="search-box" placeholder="搜索保存的代码名字..." oninput="renderSnippetList()">
    </div>
    <!-- 可上下滑动的代码堆积列表 -->
    <div class="snippet-list" id="snippetList"></div>
  </aside>

  <!-- 右侧：编辑 & 实时预览 -->
  <main class="main-content">
    
    <!-- 右上方：代码编辑框 -->
    <div class="card editor-card" id="editorCard">
      <div class="card-header">
        <input type="text" id="snippetTitle" class="name-input" placeholder="输入代码名字...">
        <div class="btn-group">
          <button class="btn" id="collapseBtn" onclick="toggleEditor()">折叠代码框</button>
          <button class="btn btn-primary" onclick="saveSnippet()">保存代码</button>
          <button class="btn" style="background:#10b981; color:#fff; border-color:#10b981;" onclick="exportDocx()">📄 导出 docx</button>
          <button class="btn btn-primary" style="background:#2563eb; border-color:#2563eb; color:#fff;" onclick="updatePreview()">▶ 预览效果</button>
        </div>
      </div>
      <div class="editor-body" id="editorBody">
        <textarea id="codeEditor" class="code-editor" placeholder="在此粘贴你的代码..."></textarea>
      </div>
    </div>

    <!-- 右下方：预览效果 (自适应缩放) -->
    <div class="card preview-card">
      <div class="card-header">
        <span class="preview-title">实时预览效果</span>
        <div class="btn-group">
          <button class="btn" onclick="setCanvasScale(1)">100%</button>
          <button class="btn" onclick="setCanvasScale(0.75)">75%</button>
          <button class="btn" onclick="setCanvasScale(0.5)">50%</button>
          <button class="btn" onclick="toggleCanvasBg()">🎨 画布黑/白</button>
        </div>
      </div>
      <div class="preview-wrapper" id="previewWrapper">
        <iframe id="previewFrame" class="preview-frame" sandbox="allow-scripts allow-same-origin"></iframe>
      </div>
    </div>

  </main>

  <script>
    const STORAGE_KEY = 'my_saved_code_snippets_v2';
    let snippets = [];
    let currentId = null;
    let isCollapsed = false;
    let currentScale = 1;
    let isWhiteCanvas = true;

    // 页面加载完成后立即绑定数据
    window.addEventListener('DOMContentLoaded', function() {
      loadSnippets();
      if (!snippets || snippets.length === 0) {
        loadDefaultExample();
      } else {
        renderSnippetList();
        selectSnippet(snippets[0].id);
      }
    });

    // 切换整体夜间模式
    function toggleDarkMode() {
      document.body.classList.toggle('dark-mode');
      const isDark = document.body.classList.contains('dark-mode');
      document.getElementById('themeBtn').textContent = isDark ? '☀️ 亮色模式' : '🌙 夜间模式';
    }

    // 切换画布黑白底色 (默认纯白)
    function toggleCanvasBg() {
      isWhiteCanvas = !isWhiteCanvas;
      const wrapper = document.getElementById('previewWrapper');
      const iframe = document.getElementById('previewFrame');
      const bg = isWhiteCanvas ? '#ffffff' : '#121212';
      wrapper.style.backgroundColor = bg;
      if (iframe) iframe.style.backgroundColor = bg;
    }

    // 画布自适应缩放 (防止组件过大看不全)
    function setCanvasScale(scale) {
      currentScale = scale;
      const iframe = document.getElementById('previewFrame');
      if (iframe) {
        iframe.style.transform = `scale(${scale})`;
        iframe.style.width = (100 / scale) + '%';
        iframe.style.height = (100 / scale) + '%';
      }
    }

    // 从本地存储装载数据
    function loadSnippets() {
      try {
        const data = localStorage.getItem(STORAGE_KEY);
        snippets = data ? JSON.parse(data) : [];
      } catch(e) {
        snippets = [];
      }
    }

    // 保存数据到本地
    function saveToStorage() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(snippets));
      } catch(e) {
        console.warn('存储受限', e);
      }
    }

    // 渲染左侧保存列表 (支持搜索和无限滚动)
    function renderSnippetList() {
      const searchInput = document.getElementById('searchInput');
      const keyword = (searchInput ? searchInput.value : '').toLowerCase().trim();
      const listContainer = document.getElementById('snippetList');
      if (!listContainer) return;
      
      listContainer.innerHTML = '';
      const filtered = snippets.filter(item => (item.title || '').toLowerCase().includes(keyword));

      if (filtered.length === 0) {
        listContainer.innerHTML = '<div class="empty-tip">没有找到代码</div>';
        return;
      }

      filtered.forEach(item => {
        const div = document.createElement('div');
        div.className = `snippet-item ${item.id === currentId ? 'active' : ''}`;
        
        // 点击列表直接进入该代码并更新右侧预览
        div.onclick = function() { selectSnippet(item.id); };

        div.innerHTML = `
          <div class="snippet-info">
            <div class="snippet-name">${escapeHtml(item.title || '未命名代码')}</div>
            <div class="snippet-date">${item.date}</div>
          </div>
          <button class="delete-btn" onclick="deleteSnippet(event, '${item.id}')" title="删除">✕</button>
        `;
        listContainer.appendChild(div);
      });
    }

    // 选中代码片段，加载并立即在右下角预览
    function selectSnippet(id) {
      const item = snippets.find(s => s.id === id);
      if (!item) return;

      currentId = item.id;
      document.getElementById('snippetTitle').value = item.title || '';
      document.getElementById('codeEditor').value = item.code || '';
      
      renderSnippetList();
      updatePreview();
    }

    // 点击保存按钮
    function saveSnippet() {
      const title = document.getElementById('snippetTitle').value.trim() || '未命名代码';
      const code = document.getElementById('codeEditor').value;
      const date = new Date().toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });

      if (currentId) {
        const index = snippets.findIndex(s => s.id === currentId);
        if (index !== -1) snippets[index] = { ...snippets[index], title, code, date };
      } else {
        const newSnippet = { id: Date.now().toString(), title, code, date };
        snippets.unshift(newSnippet);
        currentId = newSnippet.id;
      }

      saveToStorage();
      renderSnippetList();
      updatePreview();
      alert('保存成功！');
    }

    // 新建代码
    function clearEditor() {
      currentId = null;
      document.getElementById('snippetTitle').value = '';
      document.getElementById('codeEditor').value = '';
      document.getElementById('previewFrame').srcdoc = '';
      renderSnippetList();
    }

    // 删除指定的代码
    function deleteSnippet(event, id) {
      if (event && event.stopPropagation) event.stopPropagation();
      if (confirm('确定要删除这个代码片段吗？')) {
        snippets = snippets.filter(s => s.id !== id);
        saveToStorage();
        if (currentId === id) {
          clearEditor();
        } else {
          renderSnippetList();
        }
      }
    }

    // 点击导出为 docx 文件
    function exportDocx() {
      const title = document.getElementById('snippetTitle').value.trim() || '代码片段';
      const code = document.getElementById('codeEditor').value;

      if (!code) {
        alert('当前没有可导出的代码！');
        return;
      }

      const docContent = `
        <html xmlns:o='urn:schemas-microsoft-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
        <head>
          <meta charset='utf-8'>
          <title>${escapeHtml(title)}</title>
          <style>
            body { font-family: Arial, sans-serif; padding: 20px; }
            h2 { color: #333; }
            pre { background: #f4f4f4; padding: 12px; border-radius: 6px; font-family: Consolas, monospace; white-space: pre-wrap; word-wrap: break-word; }
          </style>
        </head>
        <body>
          <h2>${escapeHtml(title)}</h2>
          <pre>${escapeHtml(code)}</pre>
        </body>
        </html>
      `;

      const blob = new Blob(['\ufeff' + docContent], { type: 'application/msword' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${title}.docx`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // 渲染预览画面
    function updatePreview() {
      const code = document.getElementById('codeEditor').value || '';
      const iframe = document.getElementById('previewFrame');
      
      if (!iframe) return;

      // 补丁逻辑：强制激活 CSS 动画，防止设置了 opacity:0 的海报不显现
      const patchScript = `
        <script>
          window.addEventListener('load', function() {
            setTimeout(function() {
              var items = document.querySelectorAll('.yan-anim-item');
              for(var i=0; i<items.length; i++) { items[i].style.opacity = '1'; }
              var p = document.getElementById('yan-poster-v30');
              if(p) p.classList.add('is-visible');
            }, 100);
          });
        <\/script>
      `;

      try {
        iframe.srcdoc = code + patchScript;
      } catch(e) {
        const doc = iframe.contentDocument || iframe.contentWindow.document;
        doc.open();
        doc.write(code + patchScript);
        doc.close();
      }
    }

    // 折叠/展开上方代码框
    function toggleEditor() {
      const card = document.getElementById('editorCard');
      const btn = document.getElementById('collapseBtn');
      isCollapsed = !isCollapsed;

      if (isCollapsed) {
        card.classList.add('collapsed');
        btn.textContent = '展开代码框';
      } else {
        card.classList.remove('collapsed');
        btn.textContent = '折叠代码框';
      }
    }

    function escapeHtml(str) {
      return (str || '').replace(/[&<>"']/g, function(match) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[match];
      });
    }

    // 默认初始数据
    function loadDefaultExample() {
      const defaultSnippet = {
        id: 'default-1',
        title: '我的代码片段',
        code: `<!-- 粘贴你的代码到这里，点击【保存】或【预览效果】 -->`,
        date: new Date().toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' })
      };

      snippets = [defaultSnippet];
      saveToStorage();
      renderSnippetList();
      selectSnippet(defaultSnippet.id);
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>代码收集与预览工作台</title>
  <style>
    :root {
      --bg-main: #f8fafc;
      --bg-card: #ffffff;
      --border-color: #e2e8f0;
      --border-focus: #94a3b8;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #0f172a;
      --danger: #ef4444;
      --radius: 8px;
      --iframe-bg: #ffffff;
    }

    /* 纯黑夜间模式 */
    body.dark-mode {
      --bg-main: #000000;
      --bg-card: #121212;
      --border-color: #262626;
      --border-focus: #404040;
      --text-main: #ffffff;
      --text-muted: #888888;
      --primary: #2563eb;
      --danger: #f87171;
      --iframe-bg: #000000;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      overflow: hidden;
      transition: background-color 0.2s, color 0.2s;
    }

    /* ---------------- 左侧边栏 ---------------- */
    .sidebar {
      width: 290px;
      background: var(--bg-card);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      height: 100vh;
      transition: background-color 0.2s, border-color 0.2s;
    }

    .sidebar-header {
      padding: 12px;
      border-bottom: 1px solid var(--border-color);
      flex-shrink: 0;
    }

    .sidebar-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .search-box {
      width: 100%;
      padding: 7px 10px;
      font-size: 13px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      outline: none;
      background: var(--bg-main);
      color: var(--text-main);
    }

    .search-box:focus {
      border-color: var(--border-focus);
    }

    /* 紧凑细小的保存文件列表（支持上下独立滚动） */
    .snippet-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .snippet-list::-webkit-scrollbar {
      width: 4px;
    }
    .snippet-list::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 4px;
    }

    /* 变细的文件卡片框 */
    .snippet-item {
      padding: 6px 10px;
      min-height: 38px;
      border-radius: 6px;
      margin-bottom: 4px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-main);
    }

    .snippet-item:hover {
      border-color: var(--border-focus);
    }

    .snippet-item.active {
      background: var(--bg-card);
      border-color: var(--primary);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
    }

    .snippet-info {
      overflow: hidden;
      flex: 1;
      padding-right: 6px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .snippet-name {
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.2;
    }

    .snippet-date {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 2px;
      line-height: 1;
    }

    .delete-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 13px;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .delete-btn:hover {
      color: var(--danger);
      background: rgba(239, 68, 68, 0.15);
    }

    /* ---------------- 右侧主区域 ---------------- */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 12px;
      gap: 12px;
      overflow: hidden;
      height: 100vh;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: background-color 0.2s, border-color 0.2s;
    }

    .editor-card {
      flex-shrink: 0;
      transition: all 0.25s ease;
    }

    .card-header {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-main);
      gap: 8px;
      flex-wrap: wrap;
    }

    .name-input {
      font-size: 13px;
      font-weight: 600;
      border: 1px solid var(--border-color);
      padding: 6px 10px;
      border-radius: 5px;
      outline: none;
      flex: 1;
      min-width: 150px;
      max-width: 220px;
      background: var(--bg-card);
      color: var(--text-main);
    }

    .btn-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 500;
      border-radius: 5px;
      cursor: pointer;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-main);
      white-space: nowrap;
      transition: all 0.15s;
    }

    .btn:hover {
      border-color: var(--border-focus);
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: #2563eb;
      color: #ffffff;
      border-color: #2563eb;
    }

    .editor-body {
      height: 180px;
      transition: height 0.25s ease;
    }

    .editor-card.collapsed .editor-body {
      height: 0 !important;
      overflow: hidden;
    }

    textarea.code-editor {
      width: 100%;
      height: 100%;
      padding: 10px;
      border: none;
      outline: none;
      font-family: "Fira Code", Consolas, Monaco, monospace;
      font-size: 13px;
      line-height: 1.45;
      resize: none;
      color: var(--text-main);
      background: var(--bg-card);
    }

    .preview-card {
      flex: 1;
      min-height: 200px;
    }

    .preview-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .preview-wrapper {
      flex: 1;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--iframe-bg);
      transition: background-color 0.2s;
    }

    iframe.preview-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background-color: var(--iframe-bg);
    }

    .empty-tip {
      text-align: center;
      color: var(--text-muted);
      font-size: 12px;
      padding: 16px 0;
    }

    @media (max-width: 768px) {
      body {
        flex-direction: column;
        height: auto;
        min-height: 100vh;
        overflow-y: auto;
      }

      .sidebar {
        width: 100%;
        height: auto;
        max-height: 200px;
        border-right: none;
        border-bottom: 1px solid var(--border-color);
      }

      .main-content {
        height: auto;
        padding: 8px;
        gap: 8px;
        overflow: visible;
      }

      .card-header {
        flex-direction: column;
        align-items: stretch;
      }

      .name-input {
        max-width: 100%;
        width: 100%;
      }

      .btn-group {
        width: 100%;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 4px;
      }

      .editor-body {
        height: 150px;
      }

      .preview-card {
        height: 450px;
      }
    }
  </style>
</head>
<body>

  <!-- 左侧：已保存代码文件列表（细卡片） -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">
        <span>我的代码库</span>
        <div style="display:flex; gap:4px;">
          <button type="button" class="btn" id="themeBtn" onclick="toggleDarkMode()">🌙 夜间</button>
          <button type="button" class="btn" onclick="clearEditor()">+ 新建</button>
        </div>
      </div>
      <input type="text" id="searchInput" class="search-box" placeholder="搜索已保存的文件..." oninput="renderSnippetList()">
    </div>
    <div class="snippet-list" id="snippetList"></div>
  </aside>

  <!-- 右侧：工作区 -->
  <main class="main-content">
    
    <!-- 代码编辑区 -->
    <div class="card editor-card" id="editorCard">
      <div class="card-header">
        <input type="text" id="snippetTitle" class="name-input" placeholder="输入文件名称...">
        <div class="btn-group">
          <button type="button" class="btn" id="collapseBtn" onclick="toggleEditor()">折叠代码框</button>
          <button type="button" class="btn" onclick="exportDocx()">📄 导出 docx</button>
          <button type="button" class="btn" onclick="saveAsNewSnippet()">➕ 存为新代码</button>
          <button type="button" class="btn" style="background:#059669; color:#fff; border-color:#059669;" onclick="saveSnippet()">💾 保存修改</button>
          <button type="button" class="btn btn-primary" onclick="updatePreview()">▶ 运行预览</button>
        </div>
      </div>
      <div class="editor-body" id="editorBody">
        <textarea id="codeEditor" class="code-editor" placeholder="在此粘贴你的代码..."></textarea>
      </div>
    </div>

    <!-- 实时预览区 -->
    <div class="card preview-card" id="previewCard">
      <div class="card-header">
        <span class="preview-title">实时预览效果</span>
      </div>
      <div class="preview-wrapper">
        <iframe id="previewFrame" class="preview-frame" sandbox="allow-scripts allow-same-origin"></iframe>
      </div>
    </div>

  </main>

  <script>
    const STORAGE_KEY = 'my_code_workspace_v3';
    let snippets = [];
    let currentId = null;
    let isCollapsed = false;
    let isDarkMode = false;

    window.addEventListener('DOMContentLoaded', () => {
      loadSnippets();
      renderSnippetList();
      if (snippets.length > 0) {
        selectSnippet(snippets[0].id);
      } else {
        clearEditor();
      }
    });

    // 1. 夜间模式切换（纯黑背景）
    function toggleDarkMode() {
      isDarkMode = !isDarkMode;
      if (isDarkMode) {
        document.body.classList.add('dark-mode');
        document.getElementById('themeBtn').textContent = '☀️ 亮色';
      } else {
        document.body.classList.remove('dark-mode');
        document.getElementById('themeBtn').textContent = '🌙 夜间';
      }
    }

    // 2. 本地数据安全存储
    function loadSnippets() {
      try {
        const data = localStorage.getItem(STORAGE_KEY);
        snippets = data ? JSON.parse(data) : [];
      } catch (e) {
        snippets = [];
      }
    }

    function saveToStorage() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(snippets));
      } catch (e) {
        console.warn('存储受限', e);
      }
    }

    // 3. 渲染细致紧凑的代码列表
    function renderSnippetList() {
      const keyword = (document.getElementById('searchInput').value || '').toLowerCase().trim();
      const listContainer = document.getElementById('snippetList');
      listContainer.innerHTML = '';

      const filtered = snippets.filter(item => (item.title || '').toLowerCase().includes(keyword));

      if (filtered.length === 0) {
        listContainer.innerHTML = '<div class="empty-tip">暂无保存的代码</div>';
        return;
      }

      filtered.forEach(item => {
        const div = document.createElement('div');
        div.className = `snippet-item ${item.id === currentId ? 'active' : ''}`;
        div.onclick = () => selectSnippet(item.id);

        div.innerHTML = `
          <div class="snippet-info">
            <div class="snippet-name">${escapeHtml(item.title || '未命名文件')}</div>
            <div class="snippet-date">${item.date || ''}</div>
          </div>
          <button type="button" class="delete-btn" onclick="deleteSnippet(event, '${item.id}')" title="删除">✕</button>
        `;
        listContainer.appendChild(div);
      });
    }

    // 4. 点击列表调取代码并渲染
    function selectSnippet(id) {
      const item = snippets.find(s => s.id === id);
      if (!item) return;

      currentId = item.id;
      document.getElementById('snippetTitle').value = item.title || '';
      document.getElementById('codeEditor').value = item.code || '';
      
      renderSnippetList();
      updatePreview();

      if (window.innerWidth <= 768) {
        document.getElementById('previewCard').scrollIntoView({ behavior: 'smooth' });
      }
    }

    // 5. 强行【存为新代码】（无论如何都不覆盖原有文件）
    function saveAsNewSnippet() {
      const title = document.getElementById('snippetTitle').value.trim() || '未命名代码';
      const code = document.getElementById('codeEditor').value;
      const date = new Date().toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });

      const newId = Date.now().toString() + '_' + Math.random().toString(36).substr(2, 4);
      const newSnippet = { id: newId, title, code, date };

      snippets.unshift(newSnippet);
      currentId = newId;

      saveToStorage();
      renderSnippetList();
      updatePreview();
      alert('已作为新文件保存！');
    }

    // 6. 保存修改（如果当前无选中则自动存为新代码）
    function saveSnippet() {
      if (!currentId) {
        saveAsNewSnippet();
        return;
      }

      const title = document.getElementById('snippetTitle').value.trim() || '未命名代码';
      const code = document.getElementById('codeEditor').value;
      const date = new Date().toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });

      const index = snippets.findIndex(s => s.id === currentId);
      if (index !== -1) {
        snippets[index] = { ...snippets[index], title, code, date };
      } else {
        snippets.unshift({ id: currentId, title, code, date });
      }

      saveToStorage();
      renderSnippetList();
      updatePreview();
      alert('当前修改已保存！');
    }

    // 7. 导出 docx
    function exportDocx() {
      const title = document.getElementById('snippetTitle').value.trim() || '代码文件';
      const code = document.getElementById('codeEditor').value;

      if (!code) {
        alert('没有可导出的代码！');
        return;
      }

      const docHtml = `
        <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='[http://www.w3.org/TR/REC-html40](http://www.w3.org/TR/REC-html40)'>
        <head>
          <meta charset="utf-8">
          <title>${escapeHtml(title)}</title>
          <style>
            body { font-family: Arial, sans-serif; padding: 20px; }
            h1 { font-size: 18pt; border-bottom: 2px solid #333; padding-bottom: 6px; }
            pre { background: #f4f4f4; padding: 12px; font-family: Consolas, monospace; font-size: 10pt; white-space: pre-wrap; word-wrap: break-word; }
          </style>
        </head>
        <body>
          <h1>${escapeHtml(title)}</h1>
          <p style="color:#666; font-size:9pt;">导出时间：${new Date().toLocaleString('zh-CN')}</p>
          <hr/>
          <pre>${escapeHtml(code)}</pre>
        </body>
        </html>
      `;

      const blob = new Blob(['\ufeff', docHtml], { type: 'application/msword;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${title}.docx`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // 8. 新建空白
    function clearEditor() {
      currentId = null;
      document.getElementById('snippetTitle').value = '';
      document.getElementById('codeEditor').value = '';
      document.getElementById('previewFrame').srcdoc = '';
      renderSnippetList();
    }

    // 9. 删除文件
    function deleteSnippet(event, id) {
      if (event) event.stopPropagation();
      if (confirm('确定要删除这份代码吗？')) {
        snippets = snippets.filter(s => s.id !== id);
        saveToStorage();
        if (currentId === id) {
          clearEditor();
        } else {
          renderSnippetList();
        }
      }
    }

    // 10. 预览函数：原封不动纯粹渲染（不拼凑任何额外标签）
    function updatePreview() {
      const code = document.getElementById('codeEditor').value || '';
      const iframe = document.getElementById('previewFrame');
      iframe.srcdoc = code;
    }

    // 11. 折叠代码框
    function toggleEditor() {
      const card = document.getElementById('editorCard');
      const btn = document.getElementById('collapseBtn');
      isCollapsed = !isCollapsed;

      if (isCollapsed) {
        card.classList.add('collapsed');
        btn.textContent = '展开代码框';
      } else {
        card.classList.remove('collapsed');
        btn.textContent = '折叠代码框';
      }
    }

    function escapeHtml(str) {
      return (str || '').replace(/[&<>"']/g, match => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[match]));
    }
  </script>
</body>
</html>
